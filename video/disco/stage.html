<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Discobingo uitlegvideo: decor</title>
<!-- De huisstijl komt uit de app zelf (kleuren, lettertypes). -->
<link rel="stylesheet" href="../css/app.css">
<link rel="stylesheet" href="../css/disco.css">
<link rel="stylesheet" href="stage.css">
</head>
<body>
<div id="stage">
  <div id="devices">
    <div id="tv">
      <div class="tag is-host" id="tag-host">Spelleider <small>laptop of tv</small></div>
      <div class="tv-frame"><div class="tv-screen"><img id="img-host" alt=""></div></div>
      <div class="tv-neck"></div><div class="tv-foot"></div>
    </div>
    <div class="ph" id="ph-a"><div class="tag" id="tag-a">Anouk</div><div class="ph-screen"><div class="statusbar"><span>20:30</span><span class="sicons"></span></div><img id="img-a" alt=""></div></div>
    <div class="ph" id="ph-b"><div class="tag" id="tag-b">Bram</div><div class="ph-screen"><div class="statusbar"><span>20:30</span><span class="sicons"></span></div><img id="img-b" alt=""></div></div>
    <div class="hl"></div>
    <div class="ring" id="ring-host"><i></i><b></b></div>
    <div class="ring" id="ring-a"><i></i><b></b></div>
    <div class="ring" id="ring-b"><i></i><b></b></div>
    <div id="later"><span id="later-text"></span><em>sneller afgespeeld</em></div>
  </div>
  <div id="copy"></div>
  <div id="titlecard" class="card"></div>
  <div id="endcard" class="card"></div>
</div>
<script type="module" src="stage.js"></script>
</body>
</html>
