<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Discobingo uitlegvideo: decor</title>
<!-- De huisstijl komt uit de app zelf (kleuren, lettertypes). -->
<link rel="stylesheet" href="../css/app.css">
<link rel="stylesheet" href="../css/disco.css">
<link rel="stylesheet" href="stage.css">
</head>
<body>
<div id="stage">
  <div id="devices">
    <!-- vier echte schermen: tab 1 (spelleider), tab 2 (grote scherm), twee telefoons; stage.js zet ze neer per opstelling -->
    <div class="dev is-tv" id="dev-host"><div class="scr"><img id="img-host" alt=""></div></div>
    <div class="dev is-tv" id="dev-tv"><div class="scr"><img id="img-tv" alt=""></div></div>
    <div class="dev is-ph" id="dev-a"><div class="scr"><img id="img-a" alt=""></div></div>
    <div class="dev is-ph" id="dev-b"><div class="scr"><img id="img-b" alt=""></div></div>
    <div class="tag" id="tag-host"></div><div class="tag" id="tag-tv"></div><div class="tag" id="tag-a"></div><div class="tag" id="tag-b"></div>
    <div class="ring" id="ring-host"><i></i><b></b></div>
    <div class="ring" id="ring-a"><i></i><b></b></div>
    <div class="ring" id="ring-b"><i></i><b></b></div>
  </div>
  <div id="copy"></div>
  <div id="titlecard" class="card"></div>
  <div id="endcard" class="card"></div>
</div>
<script type="module" src="stage.js"></script>
</body>
</html>
